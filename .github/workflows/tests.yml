name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script syntax
        run: bash -n skills/swarm/scripts/open-window.sh
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
